---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - jq
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Check for existing swap file
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile

- name: Create and enable swap
  when: not swapfile.stat.exists
  block:
    - name: Allocate swap file
      ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M /swapfile"
      changed_when: true

    - name: Restrict swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format swap file
      ansible.builtin.command: mkswap /swapfile
      changed_when: true

    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      changed_when: true

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
