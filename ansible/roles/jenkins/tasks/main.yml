---
- name: Install Java
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present

- name: Add Jenkins GPG key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /etc/apt/keyrings/jenkins.asc
    mode: "0644"

- name: Add Jenkins apt repository (LTS)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Let Jenkins build and run containers
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart jenkins

- name: Start and enable Jenkins
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Wait for Jenkins to come up
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_port }}/login"
    status_code: 200
  register: jenkins_up
  until: jenkins_up.status == 200
  retries: 30
  delay: 5

- name: Read initial admin password
  ansible.builtin.slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_initial_password
  failed_when: false

- name: Show how to finish Jenkins setup
  ansible.builtin.debug:
    msg:
      - "Jenkins: http://{{ inventory_hostname }}:{{ jenkins_port }}"
      - "Initial admin password: {{ (jenkins_initial_password.content | default('') | b64decode) or 'already set up' }}"
