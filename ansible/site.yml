---
# Configures the DevFlow EC2 host created by Terraform:
# base packages + swap, Docker, Jenkins (Java 21), CloudWatch agent, app environment dirs, Prometheus + Grafana.
- name: Configure DevFlow host
  hosts: devflow
  become: true

  roles:
    - common
    - docker
    - jenkins
    - cloudwatch
    - app_env
    - monitoring
