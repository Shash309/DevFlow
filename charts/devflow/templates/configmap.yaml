apiVersion: v1
kind: ConfigMap
metadata:
  name: devflow-config
  labels:
    {{- include "devflow.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  PORT: "3000"
  PGHOST: devflow-postgres
  PGPORT: "5432"
  PGDATABASE: {{ .Values.postgres.database | quote }}
  PGUSER: {{ .Values.postgres.user | quote }}
