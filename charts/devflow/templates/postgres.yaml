apiVersion: v1
kind: Service
metadata:
  name: devflow-postgres
  labels:
    {{- include "devflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: devflow-postgres
spec:
  clusterIP: None   # headless service for the StatefulSet
  selector:
    app.kubernetes.io/name: devflow-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devflow-postgres
  labels:
    {{- include "devflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: devflow-postgres
spec:
  serviceName: devflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devflow-postgres
  template:
    metadata:
      labels:
        {{- include "devflow.labels" . | nindent 8 }}
        app.kubernetes.io/name: devflow-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: devflow-db, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
