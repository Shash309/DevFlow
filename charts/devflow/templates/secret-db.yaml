{{- /*
  Database password: generated once per environment and then kept.
  `lookup` reads the existing Secret, so upgrades never change the password.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "devflow-db" }}
apiVersion: v1
kind: Secret
metadata:
  name: devflow-db
  labels:
    {{- include "devflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
