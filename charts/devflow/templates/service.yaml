apiVersion: v1
kind: Service
metadata:
  name: devflow-app
  labels:
    {{- include "devflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: devflow-app
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: devflow-app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
