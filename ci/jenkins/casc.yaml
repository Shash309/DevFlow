# Jenkins Configuration as Code: admin user, SonarQube connection and the pipeline job.
# ${...} values come from ci/.env, which scripts/setup.ps1 generates.
jenkins:
  systemMessage: "DevFlow CI/CD - configured as code (ci/jenkins/casc.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: DevFlow Admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonar-token
              description: SonarQube analysis token
              secret: ${SONAR_TOKEN}

unclassified:
  location:
    url: http://localhost:8080/
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: sonarqube
        serverUrl: http://sonarqube:9000
        credentialsId: sonar-token

jobs:
  - script: >
      multibranchPipelineJob('DevFlow') {
        displayName('DevFlow')
        description('develop -> development, testing -> testing, staging -> staging, main -> production. feature/* branches run CI only.')
        branchSources {
          branchSource {
            source {
              git {
                id('devflow-git')
                remote('${DEVFLOW_REPO_URL:-https://github.com/Shash309/DevFlow.git}')
                traits {
                  gitBranchDiscovery()
                  headWildcardFilter {
                    includes('develop testing staging main feature/*')
                    excludes('')
                  }
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(5) }
        }
        triggers {
          periodicFolderTrigger { interval('1m') }
        }
      }
