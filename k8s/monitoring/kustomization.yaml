# kubectl apply -k k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/devflow.json
generatorOptions:
  disableNameSuffixHash: true
