# One namespace per environment: isolates each environment's app, database, secrets and quota
apiVersion: v1
kind: Namespace
metadata:
  name: development
  labels: { devflow/environment: development }
---
apiVersion: v1
kind: Namespace
metadata:
  name: testing
  labels: { devflow/environment: testing }
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels: { devflow/environment: staging }
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels: { devflow/environment: production }
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: devflow-ci
