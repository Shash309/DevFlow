# Caps what each environment may use, so one environment cannot starve the others.
# The LimitRange gives defaults to any container that does not set its own.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devflow-quota
  namespace: development
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    persistentvolumeclaims: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devflow-defaults
  namespace: development
spec:
  limits:
    - type: Container
      default: { cpu: 250m, memory: 128Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
