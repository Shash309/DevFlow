# SonarQube analysis settings (used by the "SonarQube Analysis" stage in the Jenkinsfile)
sonar.projectKey=devflow
sonar.projectName=DevFlow
sonar.sourceEncoding=UTF-8

sonar.sources=app/src
sonar.tests=app/tests
sonar.exclusions=**/node_modules/**,**/coverage/**

# Coverage from Jest (generated by the Integration Tests stage)
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
